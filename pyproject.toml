[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-loadbalancer"
version = "0.2.0"
description = "CLI e load balancer de modelos de IA servidos pelo Ollama."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "requests",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[project.scripts]
ai-lb = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
experiments = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
