[project]
name = "ai-loadbalancer"
version = "0.1.0"
description = "Load balancer de modelos de IA servidos pelo Ollama."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "requests",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]